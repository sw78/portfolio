<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analizy Magazynowo-Finansowe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#12161d;
  --surface:#1a212b;
  --surface-2:#212a36;
  --border:#2b3441;
  --text:#e7eaee;
  --text-muted:#8b96a5;
  --text-faint:#5b6674;
  --amber:#e8a33d;
  --amber-dim:#3a3222;
  --teal:#4fb3a9;
  --teal-dim:#1e3230;
  --danger:#e0645a;
  --danger-dim:#3a2422;
  --success:#6fbf73;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
@font-face{font-family:'Space Grotesk';src:local('Space Grotesk');}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}

/* ---------- LAYOUT ---------- */
#app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:64px 1fr;height:100vh;}
header{
  grid-column:1/3;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,var(--amber),#c97f22);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-weight:700;color:#1a1206;font-size:15px;
}
.brand-text h1{font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:.2px;}
.brand-text span{font-size:11px;color:var(--text-muted);font-family:var(--font-mono);}

.source-control{display:flex;align-items:center;gap:10px;}
.source-select{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  font-family:var(--font-mono);font-size:12px;padding:8px 10px;border-radius:6px;
  cursor:pointer;
}
.status-pill{
  display:flex;align-items:center;gap:6px;
  font-family:var(--font-mono);font-size:11px;color:var(--text-muted);
  padding:6px 10px;border:1px solid var(--border);border-radius:20px;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);}
.status-dot.on{background:var(--success);box-shadow:0 0 6px var(--success);}

nav#sidebar{
  border-right:1px solid var(--border);
  background:var(--surface);
  padding:16px 10px;
  overflow-y:auto;
}
.nav-group{margin-bottom:4px;}
.nav-group-head{
  display:flex;align-items:center;gap:9px;
  width:100%;background:none;border:none;color:var(--text);
  font-family:var(--font-body);font-size:13px;font-weight:600;
  padding:10px 10px;border-radius:7px;cursor:pointer;text-align:left;
}
.nav-group-head:hover{background:var(--surface-2);}
.nav-group-letter{
  font-family:var(--font-mono);font-size:10px;color:var(--bg);
  background:var(--text-faint);width:18px;height:18px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.nav-group.active .nav-group-letter{background:var(--amber);}
.nav-group-head .chev{margin-left:auto;font-size:10px;color:var(--text-faint);transition:transform .15s;}
.nav-group.open .chev{transform:rotate(90deg);}
.nav-items{display:none;flex-direction:column;gap:1px;padding:2px 0 8px 27px;}
.nav-group.open .nav-items{display:flex;}
.nav-item{
  background:none;border:none;color:var(--text-muted);text-align:left;
  font-size:12.5px;padding:7px 10px;border-radius:6px;cursor:pointer;
  border-left:2px solid transparent;
}
.nav-item:hover{color:var(--text);background:var(--surface-2);}
.nav-item.active{color:var(--amber);border-left-color:var(--amber);background:var(--amber-dim);}
.nav-item .badge{
  font-family:var(--font-mono);font-size:9px;color:var(--text-faint);
  border:1px solid var(--border);padding:1px 5px;border-radius:4px;margin-left:6px;
}

main{padding:26px 30px;overflow-y:auto;}
.view{display:none;}
.view.active{display:block;}
.view-head{margin-bottom:22px;}
.view-eyebrow{font-family:var(--font-mono);font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:1px;}
.view-title{font-family:var(--font-display);font-size:24px;font-weight:600;margin-top:4px;}
.view-desc{color:var(--text-muted);font-size:13px;margin-top:6px;max-width:640px;}

/* ---------- COMPONENTS ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px;}
.kpi-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;
}
.kpi-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}
.kpi-value{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:8px;}
.kpi-value.amber{color:var(--amber);}
.kpi-value.teal{color:var(--teal);}
.kpi-value.danger{color:var(--danger);}
.kpi-sub{font-size:11.5px;color:var(--text-faint);margin-top:4px;}

.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:18px 20px;margin-bottom:18px;
}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-title{font-family:var(--font-display);font-size:15px;font-weight:600;}
.panel-tools{display:flex;gap:8px;align-items:center;}
.chip-btn{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);
  font-size:11.5px;padding:6px 11px;border-radius:6px;cursor:pointer;font-family:var(--font-body);
}
.chip-btn:hover{color:var(--text);border-color:var(--amber);}
.chip-btn.active{color:var(--amber);border-color:var(--amber);background:var(--amber-dim);}
input.search-box{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  font-size:12.5px;padding:7px 10px;border-radius:6px;width:200px;
}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{
  text-align:left;color:var(--text-faint);font-weight:600;text-transform:uppercase;
  font-size:10.5px;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface);
}
th:hover{color:var(--text-muted);}
td{padding:9px 10px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:12px;}
tr:hover td{background:var(--surface-2);}
.tbl-wrap{max-height:420px;overflow-y:auto;border-radius:8px;}
.num{text-align:right;}
.tag{font-family:var(--font-body);font-size:10.5px;padding:2px 8px;border-radius:20px;display:inline-block;}
.tag.a{background:var(--amber-dim);color:var(--amber);}
.tag.ok{background:rgba(111,191,115,.13);color:var(--success);}
.tag.warn{background:var(--amber-dim);color:var(--amber);}
.tag.bad{background:var(--danger-dim);color:var(--danger);}
.tag.b{background:var(--teal-dim);color:var(--teal);}
.tag.c{background:rgba(139,150,165,.15);color:var(--text-muted);}

.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
.placeholder{
  border:1px dashed var(--border);border-radius:10px;padding:40px 20px;text-align:center;
  color:var(--text-faint);
}
.placeholder .pico{font-family:var(--font-mono);font-size:11px;color:var(--amber);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;}
.placeholder p{max-width:420px;margin:6px auto 0;font-size:12.5px;color:var(--text-muted);}
.chart-box{position:relative;height:230px;}
.footnote{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-top:8px;}
.credit{
  font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
  text-align:center;padding:20px 0 8px;
}
.import-card{border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px;background:var(--surface);}
.import-card-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
.import-card-title{font-family:var(--font-display);font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;}
.import-status{font-family:var(--font-mono);font-size:11px;padding:3px 9px;border-radius:20px;}
.import-status.empty{color:var(--text-faint);border:1px solid var(--border);}
.import-status.ok{color:var(--success);background:rgba(111,191,115,.12);}
.import-status.err{color:var(--danger);background:var(--danger-dim);}
.file-input{
  font-size:12px;color:var(--text-muted);background:var(--surface-2);border:1px dashed var(--border);
  border-radius:7px;padding:9px 10px;cursor:pointer;
}
.mapping-row{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center;padding:5px 0;font-size:12.5px;}
.mapping-row label{color:var(--text-muted);}
.mapping-row label .req{color:var(--danger);}
.mapping-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
@media (max-width:700px){.mapping-grid{grid-template-columns:1fr;}}
.import-errors{margin-top:8px;max-height:120px;overflow-y:auto;font-family:var(--font-mono);font-size:11px;color:var(--danger);}
.import-summary-bar{
  position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);
  padding:14px 18px;margin:20px -30px -26px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.btn-primary{
  background:linear-gradient(135deg,var(--amber),#c97f22);color:#1a1206;border:none;
  font-weight:600;font-size:13px;padding:11px 20px;border-radius:8px;cursor:pointer;
}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:64px auto 1fr;}
  nav#sidebar{border-right:none;border-bottom:1px solid var(--border);}
  .grid-2{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <div class="brand-mark">AF</div>
      <div class="brand-text">
        <h1>Analizy Magazynowo-Finansowe</h1>
        <span id="sourceLabel">ŹRÓDŁO: DANE DEMO</span>
      </div>
    </div>
    <div class="source-control">
      <span class="status-pill"><span class="status-dot on" id="statusDot"></span><span id="statusText">Połączono — dane demo</span></span>
      <select class="source-select" id="sourceSelect">
        <option value="demo">Demo — dane przykładowe</option>
        <option value="import">Import CSV / XLSX</option>
        <option value="insert" disabled>InsERT (adapter — wkrótce)</option>
        <option value="optima" disabled>Comarch Optima (adapter — wkrótce)</option>
        <option value="enova" disabled>enova365 (adapter — wkrótce)</option>
      </select>
      <button class="chip-btn" id="btnZapiszStan" title="Zapisz bieżące dane do pliku JSON na dysku">💾 Zapisz do pliku</button>
      <label class="chip-btn" style="cursor:pointer;" title="Wczytaj wcześniej zapisany plik JSON">📂 Wczytaj plik<input type="file" accept=".json" id="inputWczytajStan" style="display:none;"></label>
      <button class="chip-btn" id="btnWyczyscDane" style="color:var(--danger);border-color:var(--danger-dim);" title="Usuń wszystkie dane (demo i zaimportowane) — baza wraca do stanu pustego">🗑 Wyczyść dane</button>
    </div>
  </header>

  <nav id="sidebar"></nav>

  <main id="main">
    <div class="credit" style="display:none" id="creditTag">Szymon Wolniewicz &amp; AI — zbudowano z Chart.js</div>
  </main>
</div>

<script>
/* =====================================================================
   1. WSPÓLNY MODEL DANYCH + DataProvider (kontrakt niezależny od źródła)
   ===================================================================== */

const MAGAZYNY = ["MAG-01 Główny","MAG-02 Regionalny"];
const KATEGORIE = ["Elektronarzędzia","Chemia budowlana","Materiały wykończeniowe","Osprzęt instalacyjny","Odzież robocza","Narzędzia ręczne"];

function seededRandom(seed){
  let s = seed % 2147483647; if (s<=0) s += 2147483646;
  return function(){ s = (s*16807) % 2147483647; return (s-1)/2147483646; };
}
const rnd = seededRandom(20260819);
const pick = (arr)=>arr[Math.floor(rnd()*arr.length)];
const round2 = (n)=>Math.round(n*100)/100;

function generateDemoDataset(){
  // --- Towary ---
  const nazwyBaza = {
    "Elektronarzędzia":["Wiertarka udarowa","Szlifierka kątowa","Wkrętarka akum.","Piła tarczowa","Opalarka","Młot wyburzeniowy"],
    "Chemia budowlana":["Klej montażowy","Silikon sanitarny","Pianka montażowa","Zaprawa klejowa","Grunt głęboko penetrujący","Fuga elastyczna"],
    "Materiały wykończeniowe":["Płytka gres 60x60","Panel podłogowy AC4","Listwa przypodłogowa","Profil dylatacyjny","Farba lateksowa","Tapeta flizelinowa"],
    "Osprzęt instalacyjny":["Złączka PEX 16mm","Zawór kulowy 1/2","Rura kanalizacyjna 110","Rozdzielacz CO","Termostat pokojowy","Pompa obiegowa"],
    "Odzież robocza":["Kurtka robocza","Spodnie ochronne","Rękawice antyprzecięciowe","Kask ochronny","Buty S3","Kamizelka odblaskowa"],
    "Narzędzia ręczne":["Zestaw kluczy płasko-oczkowych","Poziomica 100cm","Miara zwijana 8m","Młotek ślusarski","Szczypce uniwersalne","Poziomnica laserowa"]
  };
  let towary = [];
  let id = 1;
  KATEGORIE.forEach(kat=>{
    nazwyBaza[kat].forEach((nazwa,i)=>{
      const cenaZakupu = round2(15 + rnd()*480);
      const marza = 0.18 + rnd()*0.35;
      const cenaSprzedazy = round2(cenaZakupu*(1+marza));
      towary.push({
        id: "TW-"+String(id).padStart(4,"0"),
        kod: kat.slice(0,3).toUpperCase()+"-"+String(1000+id),
        nazwa: nazwa,
        kategoria: kat,
        jednostka: pick(["szt","kpl","mb","kg"]),
        cenaZakupu, cenaSprzedazy,
        stanMin: Math.round(5+rnd()*15),
        stanMax: Math.round(60+rnd()*140),
        dostawcaId: "DOS-"+String(1+Math.floor(rnd()*8)).padStart(2,"0")
      });
      id++;
    });
  });

  towary.forEach(t=>{ t.slowMover = rnd() < 0.22; }); // towary celowo "zalegające" — bez sprzedaży w ostatnich miesiącach

  // --- Kontrahenci (dostawcy + klienci) ---
  let kontrahenci = [];
  for(let i=1;i<=8;i++){
    kontrahenci.push({
      id:"DOS-"+String(i).padStart(2,"0"), typ:"dostawca",
      nazwa:["Hurt-Bud Sp. z o.o.","TechMet S.A.","Instal-Pol","NordBau Import","ElektroDystrybucja","MaxTools Polska","ProBud Materiały","Sanit-Plus"][i-1],
      nip: "5"+Math.floor(1000000000+rnd()*8999999999).toString().slice(0,9),
      ocena: round2(2.8+rnd()*2.2), terminowoscPct: Math.round(70+rnd()*28)
    });
  }
  for(let i=1;i<=22;i++){
    kontrahenci.push({
      id:"KL-"+String(i).padStart(3,"0"), typ:"klient",
      nazwa: pick(["Firma Budowlana","Zakład Instalacyjny","Hurtownia","P.H.U.","Grupa Remontowa","Serwis Techniczny"])+" "+pick(["Nowak","Kowalski","Wiśniewski","Zając","Górski","Lipiński","Mazur"]),
      nip: "6"+Math.floor(1000000000+rnd()*8999999999).toString().slice(0,9),
      segment: pick(["Detaliczny","Hurtowy","Kluczowy"])
    });
  }
  const dostawcy = kontrahenci.filter(k=>k.typ==="dostawca");
  const klienci = kontrahenci.filter(k=>k.typ==="klient");

  // --- Stany magazynowe (bieżące) ---
  let stanyMagazynowe = [];
  towary.forEach(t=>{
    MAGAZYNY.forEach(mag=>{
      // towary zalegające zawsze trzymają wysoki, prawie nietknięty stan
      const ilosc = t.slowMover ? Math.round(t.stanMax*(0.65+rnd()*0.5)) : Math.round(rnd()*t.stanMax);
      stanyMagazynowe.push({
        towarId: t.id, magazyn: mag, ilosc,
        wartosc: round2(ilosc*t.cenaZakupu),
        zalegajacyFlag: t.slowMover
      });
    });
  });

  // --- Dokumenty sprzedaży (12 miesięcy wstecz) + zakupu + zwroty ---
  let dokumentySprzedazy = [];
  let dokumentyZakupu = [];
  let zwroty = [];
  const dziśData = new Date("2026-08-19");
  let docSeq = 1, docSeqZ = 1;

  for(let m=11;m>=0;m--){
    const miesiacData = new Date(dziśData.getFullYear(), dziśData.getMonth()-m, 1);
    const liczbaDokSprzedazy = 40+Math.floor(rnd()*35);
    // lekki trend wzrostowy + sezonowość (szczyt wiosna/jesień - typowe dla branży budowlanej)
    const miesiacNr = miesiacData.getMonth();
    const sezon = [0.75,0.78,1.05,1.25,1.3,1.15,1.0,0.95,1.2,1.15,0.9,0.8][miesiacNr];
    const trend = 1 + (11-m)*0.012;

    // towary "zalegające" nie sprzedają się w ostatnich 6 miesiącach — celowo brak ruchu
    const pulaTowarow = m >= 6 ? towary : towary.filter(t=>!t.slowMover);

    for(let d=0; d<liczbaDokSprzedazy*sezon*trend; d++){
      const dzien = 1+Math.floor(rnd()*27);
      const data = new Date(miesiacData.getFullYear(), miesiacData.getMonth(), dzien);
      const klient = pick(klienci);
      const liczbaPozycji = 1+Math.floor(rnd()*5);
      let pozycje = [];
      for(let p=0;p<liczbaPozycji;p++){
        const t = pick(pulaTowarow);
        const ilosc = 1+Math.floor(rnd()*12);
        pozycje.push({towarId:t.id, ilosc, cenaSprzedazy:t.cenaSprzedazy, cenaZakupu:t.cenaZakupu});
      }
      dokumentySprzedazy.push({
        id:"FS-"+String(docSeq++).padStart(5,"0"), typ:"FS", data: data.toISOString().slice(0,10),
        kontrahentId: klient.id, pozycje
      });
    }

    const liczbaDokZakupu = 6+Math.floor(rnd()*8);
    for(let d=0; d<liczbaDokZakupu; d++){
      const dzien = 1+Math.floor(rnd()*27);
      const data = new Date(miesiacData.getFullYear(), miesiacData.getMonth(), dzien);
      const dostawca = pick(dostawcy);
      const liczbaPozycji = 2+Math.floor(rnd()*8);
      let pozycje = [];
      let towaryOdDostawcy = towary.filter(t=>t.dostawcaId===dostawca.id);
      if(towaryOdDostawcy.length===0) towaryOdDostawcy = towary;
      for(let p=0;p<liczbaPozycji;p++){
        const t = pick(towaryOdDostawcy);
        const ilosc = 10+Math.floor(rnd()*60);
        pozycje.push({towarId:t.id, ilosc, cenaZakupu:t.cenaZakupu});
      }
      const terminDni = pick([14,21,30,45]);
      const terminData = new Date(data); terminData.setDate(terminData.getDate()+terminDni);
      dokumentyZakupu.push({
        id:"FZ-"+String(docSeqZ++).padStart(5,"0"), typ:"FZ", data: data.toISOString().slice(0,10),
        kontrahentId: dostawca.id, pozycje, terminPlatnosci: terminData.toISOString().slice(0,10)
      });
    }
  }

  // zwroty - losowe z ostatnich dokumentów sprzedaży
  const powodyZwrotow = ["Wada towaru","Pomyłka w zamówieniu","Niezgodność z opisem","Uszkodzenie transportowe","Rezygnacja klienta"];
  for(let i=0;i<45;i++){
    const zrodlowy = pick(dokumentySprzedazy.slice(-400));
    const pozycjaZrodlowa = pick(zrodlowy.pozycje);
    zwroty.push({
      id:"ZW-"+String(docSeqZ+i).padStart(5,"0"), dokumentZrodlowy: zrodlowy.id,
      data: zrodlowy.data, towarId: pozycjaZrodlowa.towarId,
      ilosc: 1+Math.floor(rnd()*Math.min(3,pozycjaZrodlowa.ilosc)),
      powod: pick(powodyZwrotow)
    });
  }

  // --- Rozrachunki (należności od klientów + zobowiązania wobec dostawców) ---
  let rozrachunki = [];
  dokumentyZakupu.slice(-40).forEach(fz=>{
    const wartosc = round2(fz.pozycje.reduce((s,p)=>s+p.ilosc*p.cenaZakupu,0));
    const zaplacone = rnd()<0.6;
    rozrachunki.push({
      id:"RR-Z-"+fz.id, kontrahentId: fz.kontrahentId, kierunek:"zobowiazanie",
      kwota: wartosc, termin: fz.terminPlatnosci,
      status: zaplacone ? "zaplacone" : (new Date(fz.terminPlatnosci) < dziśData ? "zalegle" : "oczekujace")
    });
  });
  dokumentySprzedazy.slice(-90).forEach(fs=>{
    const wartosc = round2(fs.pozycje.reduce((s,p)=>s+p.ilosc*p.cenaSprzedazy,0));
    const dataDok = new Date(fs.data);
    const termin = new Date(dataDok); termin.setDate(termin.getDate()+pick([7,14,30]));
    const zaplacone = rnd()<0.7;
    rozrachunki.push({
      id:"RR-N-"+fs.id, kontrahentId: fs.kontrahentId, kierunek:"naleznosc",
      kwota: wartosc, termin: termin.toISOString().slice(0,10),
      status: zaplacone ? "zaplacone" : (termin < dziśData ? "zalegle" : "oczekujace")
    });
  });

  return {towary, kontrahenci, stanyMagazynowe, dokumentySprzedazy, dokumentyZakupu, zwroty, rozrachunki};
}

/* ---- Obliczenia pomocnicze (wspólne dla modułów magazynowych) ---- */
function ostatniaSprzedazTowaru(towarId){
  let last = null;
  DATA.dokumentySprzedazy.forEach(d=>{
    if(d.pozycje.some(p=>p.towarId===towarId)){
      if(!last || d.data>last) last = d.data;
    }
  });
  return last;
}
function sprzedanaIloscOstatnie(towarId, dni){
  const graniczna = new Date("2026-08-19"); graniczna.setDate(graniczna.getDate()-dni);
  let suma = 0;
  DATA.dokumentySprzedazy.forEach(d=>{
    if(new Date(d.data) >= graniczna){
      d.pozycje.forEach(p=>{ if(p.towarId===towarId) suma += p.ilosc; });
    }
  });
  return suma;
}

function agregatStanowMagazynowych(){
  // sumuje stany po towarach (obie lokalizacje razem) + dolicza sprzedaż/rotację
  const map = {};
  DATA.stanyMagazynowe.forEach(s=>{
    if(!map[s.towarId]) map[s.towarId] = {towarId:s.towarId, ilosc:0, wartosc:0};
    map[s.towarId].ilosc += s.ilosc;
    map[s.towarId].wartosc += s.wartosc;
  });
  return Object.values(map).map(row=>{
    const t = DATA.towaryById[row.towarId];
    const sprzedaz90 = sprzedanaIloscOstatnie(row.towarId, 90);
    const ostSprzedaz = ostatniaSprzedazTowaru(row.towarId);
    const dniOdSprzedazy = ostSprzedaz ? Math.round((new Date("2026-08-19")-new Date(ostSprzedaz))/86400000) : 999;
    return {...row, towar:t, sprzedaz90, ostSprzedaz, dniOdSprzedazy};
  });
}

/* ---- A3: Optymalizacja zapasów (ROP / EOQ / zapas bezpieczeństwa) ---- */
function renderA3(){
  const LEAD_TIME_DNI = 10; // uproszczone założenie — docelowo z danych dostawcy
  const KOSZT_ZAMOWIENIA = 45; // zł / zamówienie (uproszczone)
  const KOSZT_UTRZYMANIA_PCT = 0.22; // rocznie, % wartości zapasu

  const rows = agregatStanowMagazynowych().map(r=>{
    const t = r.towar;
    const popytDzienny = r.sprzedaz90/90;
    const popytRoczny = popytDzienny*365;
    const zapasBezp = Math.round(popytDzienny * LEAD_TIME_DNI * 0.5);
    const rop = Math.round(popytDzienny*LEAD_TIME_DNI + zapasBezp);
    const eoq = popytRoczny>0 ? Math.round(Math.sqrt((2*popytRoczny*KOSZT_ZAMOWIENIA)/(t.cenaZakupu*KOSZT_UTRZYMANIA_PCT || 1))) : 0;
    const status = r.ilosc<=rop ? "bad" : (r.ilosc<=rop*1.3 ? "warn" : "ok");
    return {...r, popytDzienny:round2(popytDzienny), zapasBezp, rop, eoq, status};
  }).sort((a,b)=> (a.status==="bad"?0:a.status==="warn"?1:2) - (b.status==="bad"?0:b.status==="warn"?1:2));

  const doZamowienia = rows.filter(r=>r.status==="bad").length;

  setMain(`
    <div class="view-head">
      <div class="view-eyebrow">Grupa A — Magazyn</div>
      <div class="view-title">Optymalizacja zapasów</div>
      <div class="view-desc">Punkt zamówienia (ROP), zapas bezpieczeństwa i optymalna wielkość zamówienia (EOQ) liczone na bazie sprzedaży z ostatnich 90 dni. Parametry (czas dostawy, koszt zamówienia, koszt utrzymania) są uproszczone — docelowo pobierane per dostawca/towar.</div>
    </div>
    <div class="kpi-grid">

/* ---- Wspólne obliczenia dla Grupy B (Zamówienia i dostawcy) ---- */
const DZIS = new Date("2026-08-19");
const dniDo = (dataStr)=> Math.round((new Date(dataStr)-DZIS)/86400000);

function planZamowien(){
  // reużywa logiki ROP/EOQ z A3, ale grupuje propozycje wg dostawcy
  const LEAD_TIME_DNI = 10, KOSZT_ZAMOWIENIA = 45, KOSZT_UTRZYMANIA_PCT = 0.22;
  return agregatStanowMagazynowych().map(r=>{
    const t = r.towar;
    const popytDzienny = r.sprzedaz90/90;
    const popytRoczny = popytDzienny*365;
    const zapasBezp = Math.round(popytDzienny*LEAD_TIME_DNI*0.5);
    const rop = Math.round(popytDzienny*LEAD_TIME_DNI + zapasBezp);
    const eoq = popytRoczny>0 ? Math.max(1,Math.round(Math.sqrt((2*popytRoczny*KOSZT_ZAMOWIENIA)/(t.cenaZakupu*KOSZT_UTRZYMANIA_PCT||1)))) : 0;
    const potrzebaZamowienia = r.ilosc<=rop;
    return {...r, popytDzienny:round2(popytDzienny), rop, eoq, potrzebaZamowienia,
      dostawca: DATA.kontrahenciById[t.dostawcaId], wartoscZamowienia: round2(eoq*t.cenaZakupu)};
  }).filter(r=>r.potrzebaZamowienia && r.eoq>0);
}

function statystykiDostawcow(){
  const map = {};
  DATA.dokumentyZakupu.forEach(fz=>{
    const wartosc = round2(fz.pozycje.reduce((s,p)=>s+p.ilosc*p.cenaZakupu,0));
    if(!map[fz.kontrahentId]) map[fz.kontrahentId] = {kontrahentId:fz.kontrahentId, liczbaZamowien:0, wartosc:0, ostatnieZamowienie:null};
    map[fz.kontrahentId].liczbaZamowien += 1;
    map[fz.kontrahentId].wartosc += wartosc;
    if(!map[fz.kontrahentId].ostatnieZamowienie || fz.data>map[fz.kontrahentId].ostatnieZamowienie) map[fz.kontrahentId].ostatnieZamowienie = fz.data;
  });
  return Object.values(map).map(row=>{
    const k = DATA.kontrahenciById[row.kontrahentId];
    return {...row, dostawca:k, wartosc:round2(row.wartosc), sredniaWartosc: round2(row.wartosc/row.liczbaZamowien)};
  }).sort((a,b)=>b.wartosc-a.wartosc);
}

function kalendarzPlatnosci(){
  return DATA.rozrachunki.filter(r=>r.status!=="zaplacone").map(r=>{
    const d = dniDo(r.termin);
    let bucket;
    if(d<0) bucket = "Zaległe";
    else if(d<=7) bucket = "0–7 dni";
    else if(d<=14) bucket = "8–14 dni";
    else if(d<=30) bucket = "15–30 dni";
    else if(d<=60) bucket = "31–60 dni";
    else bucket = "60+ dni";
    return {...r, dni:d, bucket, kontrahent: DATA.kontrahenciById[r.kontrahentId]};
  }).sort((a,b)=>a.dni-b.dni);
}

/* ---- Wspólne obliczenia dla Grupy C (Prognozy) ---- */
function listaMiesiecy(n){
  const out = [];
  for(let m=n-1;m>=0;m--){
    const d = new Date(2026,7-m,1);
    out.push({label:d.toLocaleDateString("pl-PL",{month:"short",year:"2-digit"}), key:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")});
  }
  return out;
}

function sprzedazMiesiecznaTowaru(towarId, miesiace){
  return miesiace.map(m=>{
    let suma = 0;
    DATA.dokumentySprzedazy.forEach(d=>{
      if(d.data.slice(0,7)===m.key) d.pozycje.forEach(p=>{ if(p.towarId===towarId) suma += p.ilosc; });
    });
    return suma;
  });
}

// proste wygładzanie wykładnicze (SES) — prognoza na kolejny okres
function prognozaSES(szereg, alpha){
  if(szereg.every(v=>v===0)) return 0;
  let s = szereg[0];
  for(let i=1;i<szereg.length;i++) s = alpha*szereg[i] + (1-alpha)*s;
  return s;
}
function trendLiniowy(szereg){
  const n = szereg.length; if(n<2) return 0;
  const xs = szereg.map((_,i)=>i), meanX = xs.reduce((a,b)=>a+b,0)/n, meanY = szereg.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for(let i=0;i<n;i++){ num += (xs[i]-meanX)*(szereg[i]-meanY); den += (xs[i]-meanX)**2; }
  return den===0?0:num/den;
}

/* ---- C3: Prognoza zmian salda środków finansowych ---- */
function renderC3(){
  const SALDO_POCZATKOWE = 150000; // uproszczone założenie — docelowo z konta bankowego / Gratyfikanta
  const nierozliczone = kalendarzPlatnosci(); // z Grupy B — jeden wspólny model rozrachunków

  // buckety tygodniowe na najbliższe 12 tygodni
  const tygodnie = [];
  for(let i=0;i<12;i++){
    const start = new Date(DZIS); start.setDate(start.getDate()+i*7);
    const end = new Date(start); end.setDate(end.getDate()+6);
    tygodnie.push({label:"Tydz. "+(i+1), start, end});
  }
  let saldo = SALDO_POCZATKOWE;
  // zaległości (dni<0) traktujemy jako spodziewane wpłynięcie/spłatę w pierwszym tygodniu
  const zalegleNaleznosci = nierozliczone.filter(r=>r.kierunek==="naleznosc"&&r.dni<0).reduce((s,r)=>s+r.kwota,0);
  const zalegleZobowiazania = nierozliczone.filter(r=>r.kierunek==="zobowiazanie"&&r.dni<0).reduce((s,r)=>s+r.kwota,0);

  const rows = tygodnie.map((tyg,i)=>{
    let wplywy = i===0 ? zalegleNaleznosci : 0;
    let wyplywy = i===0 ? zalegleZobowiazania : 0;
    nierozliczone.forEach(r=>{
      if(r.dni<0) return;
      const termin = new Date(r.termin);
      if(termin>=tyg.start && termin<=tyg.end){
        if(r.kierunek==="naleznosc") wplywy += r.kwota; else wyplywy += r.kwota;
      }
    });
    saldo = round2(saldo + wplywy - wyplywy);
    return {...tyg, wplywy:round2(wplywy), wyplywy:round2(wyplywy), saldo};
  });
  const minSaldo = Math.min(...rows.map(r=>r.saldo));
  const tydzienRyzyka = rows.find(r=>r.saldo<0);

  setMain(`
    <div class="view-head">
      <div class="view-eyebrow">Grupa C — Prognozy</div>
      <div class="view-title">Prognoza zmian salda środków finansowych</div>

    </div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Saldo za 12 tygodni</div><div class="kpi-value ${rows[11].saldo>=0?'teal':'danger'}">${fmtPLN(rows[11].saldo)}</div><div class="kpi-sub">prognoza końcowa</div></div>
      <div class="kpi-card"><div class="kpi-label">Minimalne saldo w okresie</div><div class="kpi-value ${minSaldo>=0?'':'danger'}">${fmtPLN(minSaldo)}</div><div class="kpi-sub">${tydzienRyzyka?('ryzyko w '+tydzienRyzyka.label):'saldo nie spada poniżej zera'}</div></div>
      <div class="kpi-card"><div class="kpi-label">Śr. tygodniowe wpływy</div><div class="kpi-value teal">${fmtPLN(round2(rows.reduce((s,r)=>s+r.wplywy,0)/12))}</div><div class="kpi-sub">z tytułu należności</div></div>
    </div>
    <div class="panel">

      <div class="tbl-wrap" style="max-height:340px;"><table>
        <thead><tr><th>Okres</th><th class="num">Wpływy</th><th class="num">Wypływy</th><th class="num">Saldo na koniec</th></tr></thead>
        <tbody>${rows.map(r=>`
          <tr><td>${r.label} <span class="footnote">(${r.start.toLocaleDateString("pl-PL")}–${r.end.toLocaleDateString("pl-PL")})</span></td>
          <td class="num">${fmtPLN(r.wplywy)}</td><td class="num">${fmtPLN(r.wyplywy)}</td>
          <td class="num"><span class="tag ${r.saldo>=0?'ok':'bad'}">${fmtPLN(r.saldo)}</span></td></tr>`).join("")}
        </tbody>
      </table></div>
    </div>
  `);
  charts.c3Chart = new Chart(document.getElementById("chartC3"), {

/* ---- Wspólne obliczenia dla Grupy E (Analizy strategiczne) ---- */
function klasyfikacjaABCXYZ(){
  const miesiace = listaMiesiecy(12);
  let rows = DATA.towary.map(t=>{
    const szereg = sprzedazMiesiecznaTowaru(t.id, miesiace);
    const suma = szereg.reduce((a,b)=>a+b,0);
    const wartosc = round2(suma*t.cenaSprzedazy);
    const mean = suma/12;
    const std = Math.sqrt(szereg.reduce((s,x)=>s+(x-mean)**2,0)/12);
    const cv = mean>0 ? round2(std/mean) : null;
    return {towar:t, wartosc, cv};
  });
  const total = rows.reduce((s,r)=>s+r.wartosc,0);
  rows.sort((a,b)=>b.wartosc-a.wartosc);
  let cum=0;
  rows.forEach(r=>{
    cum += r.wartosc;
    r.udzialPct = total? round2(r.wartosc/total*100) : 0;
    r.cumPct = total? round2(cum/total*100) : 0;
    r.klasaABC = r.cumPct<=80?"A":(r.cumPct<=95?"B":"C");
    r.klasaXYZ = (r.cv===null) ? "Z" : (r.cv<=0.5?"X":(r.cv<=1.0?"Y":"Z"));
    r.klasaLaczna = r.klasaABC + r.klasaXYZ;
  });
  return rows;
}

/* ---- E3: Analiza koszyka zakupowego ---- */
function analizaKoszyka(){
  const pary = {}; const licznikTowaru = {}; let liczbaDokumentow = 0;
  DATA.dokumentySprzedazy.forEach(d=>{
    const uniqueIds = [...new Set(d.pozycje.map(p=>p.towarId))];
    if(uniqueIds.length<2) return;
    liczbaDokumentow++;
    uniqueIds.forEach(id=> licznikTowaru[id]=(licznikTowaru[id]||0)+1);
    for(let i=0;i<uniqueIds.length;i++) for(let j=i+1;j<uniqueIds.length;j++){
      const key = [uniqueIds[i],uniqueIds[j]].sort().join("|");
      pary[key] = (pary[key]||0)+1;
    }
  });
  const rows = Object.entries(pary).map(([key,count])=>{
    const [id1,id2] = key.split("|");
    return {
      t1: DATA.towaryById[id1], t2: DATA.towaryById[id2], count,
      support: round2(count/liczbaDokumentow*100),
      conf12: round2(count/licznikTowaru[id1]*100),
      conf21: round2(count/licznikTowaru[id2]*100)
    };
  }).sort((a,b)=>b.count-a.count);
  return {rows, liczbaDokumentow};
}

/* ---- Wspólne obliczenia dla Grupy F (BI / przestawne) ---- */
function liniePozycjiSprzedazy(){
  if(DATA._flatLines) return DATA._flatLines;
  let out = [];
  DATA.dokumentySprzedazy.forEach(d=>{
    const klient = DATA.kontrahenciById[d.kontrahentId];
    d.pozycje.forEach(p=>{
      const t = DATA.towaryById[p.towarId];
      out.push({
        dokumentId:d.id, miesiac:d.data.slice(0,7), kategoria:t.kategoria, towar:t.nazwa,
        klient: klient?klient.nazwa:"—", segment: klient?(klient.segment||"—"):"—",
        wartosc: p.ilosc*p.cenaSprzedazy, ilosc:p.ilosc,
        zysk: p.ilosc*(p.cenaSprzedazy-p.cenaZakupu)
      });
    });
  });
  DATA._flatLines = out;
  return out;
}
const DIM_WYMIARY = {
  kategoria:{label:"Kategoria", get:l=>l.kategoria}, towar:{label:"Towar", get:l=>l.towar},
  klient:{label:"Klient", get:l=>l.klient}, segment:{label:"Segment klienta", get:l=>l.segment},
  miesiac:{label:"Miesiąc", get:l=>l.miesiac}
};
const METRYKI_PIVOT = {
  wartosc:{label:"Wartość sprzedaży", agg:ls=>round2(ls.reduce((s,l)=>s+l.wartosc,0)), fmt:fmtPLN},
  ilosc:{label:"Ilość", agg:ls=>ls.reduce((s,l)=>s+l.ilosc,0), fmt:v=>v+""},
  zysk:{label:"Zysk", agg:ls=>round2(ls.reduce((s,l)=>s+l.zysk,0)), fmt:fmtPLN},
  liczbaDok:{label:"Liczba dokumentów", agg:ls=>new Set(ls.map(l=>l.dokumentId)).size, fmt:v=>v+""}
};
function buildPivot(rowDim, colDim, metricKey){
  const lines = liniePozycjiSprzedazy(), metryka = METRYKI_PIVOT[metricKey], rowGet = DIM_WYMIARY[rowDim].get;
  const rowVals = [...new Set(lines.map(rowGet))].sort();
  let colVals = ["Wartość"], colGet = ()=>"Wartość";
  if(colDim!=="brak"){ colGet = DIM_WYMIARY[colDim].get; colVals = [...new Set(lines.map(colGet))].sort(); }
  const table = rowVals.map(rv=>{
    const rowLines = lines.filter(l=>rowGet(l)===rv);
    const cells = colVals.map(cv=> metryka.agg(colDim==="brak"?rowLines:rowLines.filter(l=>colGet(l)===cv)) );
    return {rv, cells, total: metryka.agg(rowLines)};
  });
  const colTotals = colVals.map(cv=> metryka.agg(colDim==="brak"?lines:lines.filter(l=>colGet(l)===cv)) );
  return {rowVals, colVals, table, colTotals, grandTotal: metryka.agg(lines), metryka};
}

function analizaZwrotow(){
  const wzbogacone = DATA.zwroty.map(z=>{
    const t = DATA.towaryById[z.towarId];
    return {...z, towar:t, wartosc: round2(z.ilosc*t.cenaSprzedazy), utraconyZysk: round2(z.ilosc*(t.cenaSprzedazy-t.cenaZakupu))};
  });
  const sprzedaneSztuki = DATA.dokumentySprzedazy.reduce((s,d)=>s+d.pozycje.reduce((a,p)=>a+p.ilosc,0),0);
  const zwroconeSztuki = wzbogacone.reduce((s,z)=>s+z.ilosc,0);
  return {wzbogacone, sprzedaneSztuki, zwroconeSztuki,
    wartoscLaczna: round2(wzbogacone.reduce((s,z)=>s+z.wartosc,0)),
    utraconyZyskLaczny: round2(wzbogacone.reduce((s,z)=>s+z.utraconyZysk,0))};
}

let importState = {}; // id -> {headers, rawRows, mapping, parsedRows, errors}

function normalizeHeader(s){
  return (s===undefined||s===null?"":s.toString()).trim().toLowerCase()
    .replace(/ą/g,"a").replace(/ć/g,"c").replace(/ę/g,"e").replace(/ł/g,"l")
    .replace(/ń/g,"n").replace(/ó/g,"o").replace(/ś/g,"s").replace(/ź/g,"z").replace(/ż/g,"z");
}
function autoMap(headers, fields){
  const norm = headers.map(h=>({orig:h, n:normalizeHeader(h)}));
  const mapping = {};
  fields.forEach(f=>{
    const found = norm.find(h=> f.aliases.some(a=> h.n===normalizeHeader(a) || h.n.includes(normalizeHeader(a))));
    mapping[f.key] = found ? found.orig : "";
  });
  return mapping;
}
function parseDate(v){
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === "string"){
    let m = v.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
    m = v.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/); if(m) return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
    const d = new Date(v); if(!isNaN(d)) return d.toISOString().slice(0,10);
  }
  return null;
}
function slug(str){
  return (str===undefined||str===null?"":str.toString()).trim().toUpperCase()
    .replace(/[^A-Z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,24) || "BRAK";
}
function znajdzTowar(kodLubNazwa, towary){
  if(!kodLubNazwa) return undefined;
  const q = normalizeHeader(kodLubNazwa);
  return towary.find(t=> normalizeHeader(t.kod)===q || normalizeHeader(t.id)===q || normalizeHeader(t.nazwa)===q);
}

function applyMapping(entityId){
  const st = importState[entityId];
  const spec = ENTITIES.find(e=>e.id===entityId);
  if(!st) return;
  const missingRequired = spec.fields.filter(f=>f.required && !st.mapping[f.key]);
  if(missingRequired.length){
    st.parsedRows = [];
    st.errors = ["Brak mapowania dla wymaganych pól: "+missingRequired.map(f=>f.label).join(", ")];
    return;
  }
  const parsed = [], errors = [];
  st.rawRows.forEach((raw,idx)=>{
    const row = {}; let rowError = null;
    spec.fields.forEach(f=>{
      const col = st.mapping[f.key];
      let val = col ? raw[col] : undefined;
      if(val==="" ) val = undefined;
      if(f.type==="number" && val!==undefined){
        const num = Number(String(val).replace(",", "."));
        if(isNaN(num)) rowError = rowError || ("nieprawidłowa liczba w polu „"+f.label+"”");
        else val = num;
      }
      if(f.type==="date" && val!==undefined){
        const d = parseDate(val);
        if(!d) rowError = rowError || ("nieprawidłowa data w polu „"+f.label+"”");
        else val = d;
      }
      if(f.required && val===undefined) rowError = rowError || ("brak wartości w polu „"+f.label+"”");
      row[f.key] = val;
    });
    if(rowError) errors.push("Wiersz "+(idx+2)+": "+rowError);
    else parsed.push(row);
  });
  st.parsedRows = parsed;
  st.errors = errors;
}

async function wczytajPlik(entityId, file){
  const spec = ENTITIES.find(e=>e.id===entityId);
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array", cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {defval:""});
  const headers = rows.length ? Object.keys(rows[0]) : [];
  const mapping = autoMap(headers, spec.fields);
  importState[entityId] = {fileName:file.name, headers, rawRows:rows, mapping, parsedRows:[], errors:[]};
  applyMapping(entityId);
}

function pobierzSzablon(entityId){
  const spec = ENTITIES.find(e=>e.id===entityId);
  const headers = spec.fields.map(f=>f.key);
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet([spec.example], {header:headers});
  XLSX.utils.book_append_sheet(wb, ws, "Szablon");
  XLSX.writeFile(wb, "szablon_"+entityId+".xlsx");
}

/* ---- Budowa finalnego zestawu danych ze zaimportowanych plików ---- */
function grupujPozycjeWDokumenty(rows, towary, upsertKontrahent, typKontrahenta, jestZakup){
  const mapaDok = {}; let licznik=0;
  rows.forEach(r=>{
    const t = znajdzTowar(r.towar, towary); if(!t) return;
    const nazwaKontrahenta = jestZakup ? r.dostawca : r.kontrahent;
    const kontrahent = upsertKontrahent(nazwaKontrahenta, typKontrahenta);
    if(!kontrahent) return;
    const docId = r.dokument || ((jestZakup?"FZ-IMP-":"FS-IMP-")+(licznik++));
    if(!mapaDok[docId]){
      mapaDok[docId] = {id:docId, typ: jestZakup?"FZ":"FS", data: r.data, kontrahentId: kontrahent.id, pozycje:[]};
      if(jestZakup) mapaDok[docId].terminPlatnosci = r.termin_platnosci || r.data;
    }
    mapaDok[docId].pozycje.push({
      towarId: t.id, ilosc: r.ilosc||1,
      cenaSprzedazy: jestZakup ? undefined : (r.cena_sprzedazy!==undefined ? r.cena_sprzedazy : t.cenaSprzedazy),
      cenaZakupu: r.cena_zakupu!==undefined ? r.cena_zakupu : t.cenaZakupu
    });
  });
  return Object.values(mapaDok);
}

function zbudujDataZImportu(){
  const towaryRaw = importState.towary ? importState.towary.parsedRows : [];
  const towary = towaryRaw.map(r=>({
    id: r.kod, kod: r.kod, nazwa: r.nazwa, kategoria: r.kategoria,
    jednostka: r.jednostka || "szt", cenaZakupu: r.cena_zakupu, cenaSprzedazy: r.cena_sprzedazy,
    dostawcaId: r.dostawca ? "K-"+slug(r.dostawca) : null, stanMin:0, stanMax:0
  }));

  const kontrahenciMap = {};
  (importState.kontrahenci ? importState.kontrahenci.parsedRows : []).forEach(r=>{
    const id = "K-"+slug(r.nazwa);
    kontrahenciMap[id] = {id, typ: normalizeHeader(r.typ).includes("dost") ? "dostawca":"klient",
      nazwa:r.nazwa, nip:r.nip||"", segment:r.segment||"",
      ocena: r.ocena!==undefined?r.ocena:4.0, terminowoscPct: r.terminowosc!==undefined?r.terminowosc:90};
  });
  function upsertKontrahent(nazwa, typHint){
    if(!nazwa) return null;
    const id = "K-"+slug(nazwa);
    if(!kontrahenciMap[id]) kontrahenciMap[id] = {id, typ:typHint, nazwa, nip:"", segment:"", ocena:4.0, terminowoscPct:90};
    return kontrahenciMap[id];
  }
  // towary z przypisanym dostawcą — zarejestruj kontrahenta, jeśli jeszcze nie istnieje
  towary.forEach(t=>{ if(t.dostawcaId && !kontrahenciMap[t.dostawcaId]){
    const nazwa = towaryRaw.find(r=>r.kod===t.kod).dostawca;
    upsertKontrahent(nazwa, "dostawca");
  }});

  const stanyMagazynowe = (importState.stany ? importState.stany.parsedRows : []).map(r=>{
    const t = znajdzTowar(r.towar, towary);
    if(!t) return null;
    return {towarId:t.id, magazyn: r.magazyn||"MAG-01", ilosc:r.ilosc, wartosc: round2(r.ilosc*t.cenaZakupu)};
  }).filter(Boolean);

  const dokumentySprzedazy = grupujPozycjeWDokumenty(importState.sprzedaz?importState.sprzedaz.parsedRows:[], towary, upsertKontrahent, "klient", false);
  const dokumentyZakupu = grupujPozycjeWDokumenty(importState.zakupy?importState.zakupy.parsedRows:[], towary, upsertKontrahent, "dostawca", true);

  const zwroty = (importState.zwroty?importState.zwroty.parsedRows:[]).map((r,i)=>{
    const t = znajdzTowar(r.towar, towary); if(!t) return null;
    return {id:"ZW-IMP-"+i, dokumentZrodlowy:r.dokument_zrodlowy||"", data:r.data, towarId:t.id, ilosc:r.ilosc||1, powod:r.powod||"Nieokreślony"};
  }).filter(Boolean);

  const rozrachunki = (importState.rozrachunki?importState.rozrachunki.parsedRows:[]).map((r,i)=>{
    const k = upsertKontrahent(r.kontrahent, normalizeHeader(r.kierunek).includes("zobow")?"dostawca":"klient");
    if(!k) return null;
    const kierunek = normalizeHeader(r.kierunek).includes("zobow") ? "zobowiazanie" : "naleznosc";
    const status = r.status || (dniDo(r.termin)<0 ? "zalegle" : "oczekujace");
    return {id:"RR-IMP-"+i, kontrahentId:k.id, kierunek, kwota:r.kwota, termin:r.termin, status};
  }).filter(Boolean);

  return {towary, kontrahenci:Object.values(kontrahenciMap), stanyMagazynowe, dokumentySprzedazy, dokumentyZakupu, zwroty, rozrachunki};
}

/* ---- DataProvider zwracający już zbudowany zestaw (import lub przyszły adapter) ---- */
class StaticDataProvider{
  constructor(dataset){ this._d = dataset; }
  async getTowary(){ return this._d.towary; }
  async getKontrahenci(){ return this._d.kontrahenci; }
  async getStanyMagazynowe(){ return this._d.stanyMagazynowe; }
  async getDokumentySprzedazy(){ return this._d.dokumentySprzedazy; }
  async getDokumentyZakupu(){ return this._d.dokumentyZakupu; }
  async getZwroty(){ return this._d.zwroty; }
  async getRozrachunki(){ return this._d.rozrachunki; }
}

/* ---- Widok importu ---- */
function renderImportView(){
  const MODULY_ZA_ENCJE = {
    towary:"A, C1, E1, E2, E3, F1", stany:"A1, A2, A3",
    sprzedaz:"C, E, F1, dashboard", zakupy:"B1, B2",
    zwroty:"G1, G2", kontrahenci:"B2, nazwy klientów/dostawców wszędzie", rozrachunki:"B3, C3, H1"
  };
  function karta(spec){
    const st = importState[spec.id];
    const status = !st ? `<span class="import-status empty">nie wczytano</span>`
      : (st.errors.length ? `<span class="import-status err">${st.errors.length} błędów</span>`
      : `<span class="import-status ok">✓ ${st.parsedRows.length} wierszy</span>`);
    const znacznik = spec.zalecane
      ? '<span class="footnote">zalecane — odblokowuje najwięcej modułów</span>'
      : '<span class="footnote">opcjonalne</span>';
    return `
      <div class="import-card">
        <div class="import-card-head">
          <div class="import-card-title">${spec.label} ${znacznik} ${status}</div>
          <div style="display:flex;gap:8px;">
            <button class="chip-btn" onclick="pobierzSzablon('${spec.id}')">Pobierz szablon</button>
            <label class="chip-btn" style="cursor:pointer;">Wybierz plik<input type="file" accept=".csv,.xlsx,.xls" style="display:none;" onchange="onPlikWybrany('${spec.id}', this.files[0])"></label>
          </div>
        </div>
        <div class="footnote" style="margin-bottom:8px;">Zasila moduły: ${MODULY_ZA_ENCJE[spec.id]}</div>
        ${st ? `
          <div class="footnote" style="margin-bottom:8px;">Plik: ${st.fileName} · ${st.rawRows.length} wierszy wykrytych</div>
          <div class="mapping-grid">
            ${spec.fields.map(f=>`
              <div class="mapping-row">
                <label>${f.label}${f.required?' <span class="req">*</span>':''}</label>
                <select class="source-select" onchange="onMapowanieZmiana('${spec.id}','${f.key}', this.value)">
                  <option value="">— nie mapuj —</option>
                  ${st.headers.map(h=>`<option value="${h}" ${st.mapping[f.key]===h?'selected':''}>${h}</option>`).join("")}
                </select>
              </div>`).join("")}
          </div>
          ${st.errors.length ? `<div class="import-errors">${st.errors.slice(0,8).map(e=>"⚠ "+e).join("<br>")}${st.errors.length>8?`<br>… i ${st.errors.length-8} więcej`:''}</div>` : ''}
        ` : `<div class="footnote">Wgraj plik CSV lub XLSX z eksportu systemu (Subiekt/Optima/enova/Wapro/inny) albo pobierz szablon, żeby zobaczyć oczekiwany układ kolumn.</div>`}
      </div>`;
  }

  const zaimportowane = ENTITIES.filter(e=> importState[e.id] && importState[e.id].parsedRows.length>0 && importState[e.id].errors.length===0);
  const czyCokolwiekGotowe = zaimportowane.length>0;

  setMain(`
    <div class="view-head">
      <div class="view-eyebrow">Etap 10 — Import realnych danych</div>
      <div class="view-title">Import CSV / XLSX</div>
      <div class="view-desc">Wgraj eksporty z prawdziwego systemu (dowolnego — InsERT, Comarch Optima, enova365, Wapro...). Aplikacja sama proponuje mapowanie kolumn na podstawie nazw nagłówków — zawsze można je poprawić ręcznie. <strong>Możesz zaimportować tylko jeden plik</strong>, np. same Rozrachunki — moduły, które go nie potrzebują, po prostu pokażą pusty stan zamiast się wywalić.</div>
    </div>
    ${ENTITIES.map(karta).join("")}
    <div class="import-summary-bar">
      <div class="footnote" style="font-size:11.5px;">
        ${czyCokolwiekGotowe
          ? "Gotowe do analizy: "+zaimportowane.map(e=>e.label).join(", ")+" — odblokują moduły: "+zaimportowane.map(e=>MODULY_ZA_ENCJE[e.id]).join(", ")
          : "Wczytaj przynajmniej jeden plik, żeby odblokować przycisk analizy."}
      </div>
      <button class="btn-primary" id="btnUruchomImport" ${czyCokolwiekGotowe?'':'disabled'}>Uruchom analizy na zaimportowanych danych</button>
    </div>
  `);

  const btn = document.getElementById("btnUruchomImport");
  if(btn) btn.onclick = async ()=>{
    const dataset = zbudujDataZImportu();
    provider = new StaticDataProvider(dataset);
    await loadAll();
    document.getElementById("sourceLabel").textContent = "ŹRÓDŁO: IMPORT — "+dataset.towary.length+" towarów, "+dataset.dokumentySprzedazy.length+" dok. sprzedaży";
    document.getElementById("statusText").textContent = "Połączono — dane zaimportowane";
    navigateTo("dashboard", "D");
  };
}

async function onPlikWybrany(entityId, file){
  if(!file) return;
  await wczytajPlik(entityId, file);
  renderImportView();
}
function onMapowanieZmiana(entityId, fieldKey, headerValue){
  importState[entityId].mapping[fieldKey] = headerValue;
  applyMapping(entityId);
  renderImportView();
}

function eksportStanuDoPliku(){
  const payload = {
    format: "analizy-magazynowo-finansowe/zapis", wersja: 1,
    zapisano: new Date().toISOString(),
    dataset: {
      towary: DATA.towary, kontrahenci: DATA.kontrahenci, stanyMagazynowe: DATA.stanyMagazynowe,
      dokumentySprzedazy: DATA.dokumentySprzedazy, dokumentyZakupu: DATA.dokumentyZakupu,
      zwroty: DATA.zwroty, rozrachunki: DATA.rozrachunki
    }
  };
  const blob = new Blob([JSON.stringify(payload)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "analizy-dane-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function wczytajStanZPliku(file){
  if(!file) return;
  let payload;
  try{ payload = JSON.parse(await file.text()); }
  catch(e){ alert("Nie udało się odczytać pliku — upewnij się, że to plik zapisany przyciskiem „Zapisz do pliku”."); return; }
  if(!payload || !payload.dataset || !Array.isArray(payload.dataset.towary)){
    alert("Plik nie zawiera rozpoznawalnego zestawu danych.");
    return;
  }
  provider = new StaticDataProvider(payload.dataset);
  await loadAll();
  const data = payload.zapisano ? new Date(payload.zapisano).toLocaleString("pl-PL") : "nieznana data";
  document.getElementById("sourceLabel").textContent = "ŹRÓDŁO: WCZYTANY PLIK (zapisano "+data+")";
  document.getElementById("statusText").textContent = "Połączono — wczytano zapis z pliku";
  destroyAllCharts();
  navigateTo("dashboard","D");
}

document.getElementById("btnZapiszStan").addEventListener("click", eksportStanuDoPliku);
document.getElementById("inputWczytajStan").addEventListener("change",(e)=> wczytajStanZPliku(e.target.files[0]));
document.getElementById("btnWyczyscDane").addEventListener("click", wyczyscWszystkoDane);

async function wyczyscWszystkoDane(){
  const ok = confirm("Usunąć wszystkie dane (dane demo i wszystko, co zostało zaimportowane)? Baza wróci do stanu pustego. Jeśli chcesz je zachować, najpierw kliknij „Zapisz do pliku”.");
  if(!ok) return;
  importState = {};
  provider = new StaticDataProvider({towary:[], kontrahenci:[], stanyMagazynowe:[], dokumentySprzedazy:[], dokumentyZakupu:[], zwroty:[], rozrachunki:[]});
  await loadAll();
  destroyAllCharts();
  document.getElementById("sourceLabel").textContent = "ŹRÓDŁO: BRAK DANYCH (wyczyszczono)";
  document.getElementById("statusText").textContent = "Baza pusta — wybierz demo lub wgraj dane";
  document.getElementById("statusDot").classList.remove("on");
  navigateTo("dashboard","D");
}

   6. START
   ===================================================================== */
async function init(){
  document.getElementById("statusText").textContent = "Ładowanie danych demo...";
  await loadAll();
  document.getElementById("statusText").textContent = "Połączono — dane demo";
  renderNav();
  renderDashboard();
}

document.getElementById("sourceSelect").addEventListener("change",(e)=>{
  const v = e.target.value;
  if(v==="demo"){
    document.getElementById("sourceLabel").textContent = "ŹRÓDŁO: DANE DEMO";
    document.getElementById("statusText").textContent = "Połączono — dane demo";
    provider = new DemoDataProvider();
    loadAll().then(()=> navigateTo("dashboard","D"));
  } else if(v==="import"){
    document.getElementById("sourceLabel").textContent = "ŹRÓDŁO: IMPORT CSV/XLSX — konfiguracja";
    document.getElementById("statusText").textContent = "Oczekiwanie na pliki";
    document.querySelectorAll(".nav-item").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".nav-group").forEach(g=>g.classList.remove("active"));
    destroyAllCharts();
    renderImportView();
  }
});

init();
</script>

fetch("https://countapi.mileshilliard.com/api/v1/hit/" + COUNTER_KEY)
.then(function (r) { return r.json(); })
.then(function () {
localStorage.setItem(LAST_VISIT_KEY, String(now));
})
.catch(function () {});
}

if (document.visibilityState === "visible") {
sendHit();
} else {
document.addEventListener("visibilitychange", function once() {
if (document.visibilityState === "visible") {
document.removeEventListener("visibilitychange", once);
sendHit();
}
});
}
})();
